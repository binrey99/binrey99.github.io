<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang tỏ tình</title>
<style>
:root{--bg:#0f1724;--card:#0b1220;--accent:#ff6b81;--muted:#aab3c3}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;background:linear-gradient(180deg,#071022 0%, #0d1b2a 100%);color:#e6eef6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:100%;max-width:760px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.03));border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(2,6,23,0.6);position:relative;overflow:hidden}
h1{margin:0 0 6px;font-size:28px;letter-spacing:0.4px}
p.lead{margin:0 0 18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 320px;gap:18px}
.left{padding:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;outline:none;font-size:14px}
textarea{min-height:130px;resize:vertical}
.btn{display:inline-block;padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:white;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06)}
.right{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.heart{width:160px;height:160px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 30% 20%, rgba(255,107,129,0.18), transparent 20%),linear-gradient(180deg, rgba(255,107,129,0.06), transparent);box-shadow:inset 0 -8px 30px rgba(255,107,129,0.02)}
.heart svg{width:96px;height:96px;filter:drop-shadow(0 6px 20px rgba(255,107,129,0.12));animation:beat 1s infinite}
@keyframes beat{0%{transform:scale(1)}25%{transform:scale(1.08)}40%{transform:scale(0.98)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.footer{margin-top:16px;display:flex;gap:10px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.preview{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.02));padding:12px;border-radius:10px;min-height:86px}
/* modal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .18s}
.modal.open{opacity:1;pointer-events:auto}
.modal .dialog{background:var(--card);padding:22px;border-radius:12px;max-width:640px;width:94%;text-align:center}
.modal .dialog p{margin:12px 0}
.share{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.small{font-size:13px;color:var(--muted)}
/* responsive */
@media (max-width:820px){.grid{grid-template-columns:1fr;}.right{order:-1;margin-bottom:8px}}
</style>
</head>
<body>
<div class="card">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
<div>
<h1>Muốn nói với ai đó?</h1>
<p class="lead">Viết vài dòng, tạo link và gửi đi. Trang này chỉ để tỏ tình nhẹ nhàng ❤️</p>
</div>
<div class="note">An toàn: nội dung không được gửi ra server — toàn bộ xử lý ở trình duyệt.</div>
</div>


<div class="grid" style="margin-top:14px">
<div class="left">
<label for="to">Gửi tới (tên người nhận)</label>
<input id="to" type="text" placeholder="Ví dụ: Linh" />


<label style="margin-top:12px" for="msg">Lời tỏ tình</label>
<textarea id="msg" placeholder="Viết lời tỏ tình ở đây..."></textarea>


<div style="display:flex;gap:8px;margin-top:12px">
<button id="previewBtn" class="btn">Xem trước</button>
<button id="shareBtn" class="btn ghost">Tạo link tỏ tình</button>
<button id="copyBtn" class="btn ghost">Sao chép link</button>
</div>


<div class="footer">
<div class="note">Mẹo: dùng nút "Tạo link" để chia sẻ qua tin nhắn.</div>
</div>
</div>


<div class="right">
<div class="heart" aria-hidden>
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M12 21s-7.5-4.5-9.5-7.5S4 6 8.5 6C10.9 6 12 8 12 8s1.1-2 3.5-2C20 6 22.5 10.5 21.5 13.5S12 21 12 21z" fill="url(#g)"/>
</html>
